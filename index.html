<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">BEST COMBO</span>
          <span class="value" id="best-combo">0</span>
        </div>
        <div class="panel-section">
          <span class="label">MAX LINES</span>
          <span class="value" id="max-lines">0</span>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- Name entry section (shown at game-over if score qualifies) -->
        <div id="name-input-section" class="hidden">
          <p class="hs-prompt">You made the top 5! Enter your name:</p>
          <div class="name-entry-row">
            <input id="player-name-input" type="text" maxlength="16" placeholder="Your name" autocomplete="off" />
            <button id="save-score-btn">Save</button>
          </div>
        </div>

        <!-- High scores table -->
        <div id="high-scores-section" class="hidden">
          <ul id="high-scores-list" class="hs-list"></ul>
          <button id="reset-records-btn" class="reset-btn">Reset Records</button>
        </div>

        <button id="restart-btn">Play</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
