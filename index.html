<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="records-panel" class="records-panel">
      <div class="records-header">
        <span class="label">RECORDS</span>
        <button id="reset-records-btn" class="reset-records-btn" type="button" title="Reiniciar records">&#8634;</button>
      </div>
      <div id="records-list" class="records-list"></div>
      <div class="records-stats">
        <div class="records-stat"><span class="label">COMBO</span><span id="best-combo" class="records-stat-val">0</span></div>
        <div class="records-stat"><span class="label">LÍNEAS MÁX</span><span id="max-lines" class="records-stat-val">0</span></div>
      </div>
    </div>

    <div id="name-entry" class="name-entry hidden">
      <p id="name-entry-title" class="name-entry-title">¡Nuevo record!</p>
      <input id="name-input" class="name-input" type="text" maxlength="12" placeholder="Nombre" autocomplete="off" />
      <button id="save-record-btn" class="save-record-btn" type="button">Guardar</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
