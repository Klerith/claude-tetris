<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <label class="label" for="name-input">¡Nuevo récord! Escribe tu nombre:</label>
          <div class="name-entry-row">
            <input id="name-input" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
            <button id="save-score-btn">Guardar</button>
          </div>
        </div>

        <div id="gameover-hs" class="highscore-panel hidden">
          <p class="hs-title">MEJORES PUNTUACIONES</p>
          <table class="hs-table"><tbody id="gameover-hs-body"></tbody></table>
          <div class="stats-row">
            <div class="stat-item">
              <span class="label">MEJOR COMBO</span>
              <span class="stat-value" id="gameover-best-combo">0</span>
            </div>
            <div class="stat-item">
              <span class="label">MÁX. LÍNEAS</span>
              <span class="stat-value" id="gameover-max-lines">0</span>
            </div>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>

        <div class="highscore-panel">
          <p class="hs-title">MEJORES PUNTUACIONES</p>
          <table class="hs-table"><tbody id="start-hs-body"></tbody></table>
          <div class="stats-row">
            <div class="stat-item">
              <span class="label">MEJOR COMBO</span>
              <span class="stat-value" id="start-best-combo">0</span>
            </div>
            <div class="stat-item">
              <span class="label">MÁX. LÍNEAS</span>
              <span class="stat-value" id="start-max-lines">0</span>
            </div>
          </div>
          <button id="reset-scores-btn" class="secondary-btn">Borrar récords</button>
        </div>

        <button id="start-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
