<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section" id="hold-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section" id="energy-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
          <span class="energy-hint">Pulsa <kbd>E</kbd></span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="ability-overlay" class="overlay hidden">
      <div class="overlay-box ability-box">
        <p class="ability-title">ELIGE UNA HABILIDAD</p>
        <div id="ability-grid" class="ability-grid">
          <button class="ability-card" data-ability="preview">
            <span class="ability-icon">👁</span>
            <span class="ability-name">Ver siguientes 5</span>
            <span class="ability-desc">Muestra las próximas 5 piezas durante 5 turnos.</span>
          </button>
          <button class="ability-card" data-ability="swap">
            <span class="ability-icon">🔄</span>
            <span class="ability-name">Intercambiar pieza</span>
            <span class="ability-desc">Cambia la pieza actual por otra distinta al azar.</span>
          </button>
          <button class="ability-card" data-ability="slow">
            <span class="ability-icon">🐌</span>
            <span class="ability-name">Ralentizar 10s</span>
            <span class="ability-desc">Reduce la velocidad de caída durante 10 segundos.</span>
          </button>
          <button class="ability-card" data-ability="undo">
            <span class="ability-icon">↩</span>
            <span class="ability-name">Deshacer colocación</span>
            <span class="ability-desc">Revierte tu última pieza colocada.</span>
          </button>
        </div>
        <p class="ability-hint"><kbd>Esc</kbd> para cancelar</p>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
