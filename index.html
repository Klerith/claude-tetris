<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="gameover-records" class="records-box hidden">
          <div id="record-entry" class="record-entry hidden">
            <span>¡Entras en el top 5!</span>
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="record-save" type="button">Guardar</button>
          </div>
          <div id="gameover-table"></div>
          <p id="gameover-stats" class="rec-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box records-box">
        <p class="start-title">TETRIS</p>
        <p class="rec-heading">TOP 5</p>
        <div id="start-table"></div>
        <p id="start-stats" class="rec-stats"></p>
        <button id="start-btn" type="button">Jugar</button>
        <button id="reset-records-btn" type="button" class="rec-link">Resetear records</button>
        <div id="reset-confirm" class="reset-confirm hidden">
          <span>¿Borrar todos los records?</span>
          <button id="reset-yes" type="button">Sí</button>
          <button id="reset-no" type="button">No</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
