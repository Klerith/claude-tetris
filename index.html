<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <!-- Game over / pause overlay -->
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-stats" class="overlay-stats hidden"></div>
        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <input type="text" id="player-name" class="player-name-input" maxlength="12" placeholder="Nombre" />
          <button id="save-score-btn" class="action-btn">Guardar</button>
        </div>
        <div id="highscores-container" class="highscores-container hidden">
          <p class="highscores-title">TOP 5</p>
          <table id="highscores-table" class="highscores-table"></table>
        </div>
        <button id="clear-records-btn" class="clear-btn hidden">Borrar records</button>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button id="start-btn" class="action-btn start-play-btn">Jugar</button>
        <div id="start-stats" class="overlay-stats"></div>
        <div class="highscores-container">
          <p class="highscores-title">TOP 5</p>
          <table id="start-highscores-table" class="highscores-table"></table>
        </div>
        <button id="start-clear-btn" class="clear-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
